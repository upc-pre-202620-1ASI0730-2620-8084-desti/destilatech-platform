# Local environment: MySQL + Destilatech Platform API.
# Run with: docker compose up -d --build
services:
  mysql:
    image: mysql:8.4
    container_name: destilatech-mysql
    environment:
      MYSQL_ROOT_PASSWORD: destilatech
      MYSQL_DATABASE: destilatech
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdestilatech"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    container_name: destilatech-platform-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "server=mysql;user=root;password=destilatech;database=destilatech"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
